name = consoleRedrawFix
summary = "Console Redraw Fix"
description = """Stops NVDA from reading the whole console again when a program like Claude Code redraws the screen. Only works in terminal windows, meaning Windows Terminal and the classic console that cmd and PowerShell open in. After a redraw it speaks only the lines you haven't heard yet and puts the review cursor on the last line of text."""
author = "Conner Erwin <conner@connererwin.com>"
version = 1.0.0
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.3.0
