name = consoleRedrawFix
summary = "Console Redraw Fix"
description = """Stops NVDA from reading the whole console again when a program like Claude Code redraws the screen. Only works in terminal windows, meaning Windows Terminal and the classic console that cmd and PowerShell open in. After a redraw it speaks only the lines you haven't heard yet and puts the review cursor on the last line of text. In a Claude Code window set up with the quiet-tools mod, Control+F finds text in the conversation and opens the whole conversation in browse mode at the most recent match, and NVDA+Control+L reads Claude's last reply (pressed twice, it opens it in browse mode). New text no longer moves the review cursor unless you turn that on in NVDA settings under Console Redraw Fix; NVDA+A reads from the review cursor, and Down Arrow puts the review cursor on the last line."""
author = "Conner Erwin <conner@connererwin.com>"
version = 1.3.0
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.3.0
