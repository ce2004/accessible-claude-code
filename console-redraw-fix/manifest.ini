name = consoleRedrawFix
summary = "Console Redraw Fix"
description = """Stops NVDA from reading the whole console again when a program like Claude Code redraws the screen. Only works in Claude Code windows set up with the quiet-tools mod, in Windows Terminal or the classic console; other terminal windows work as usual. After a redraw it speaks only the lines you haven't heard yet. In a Claude Code window set up with the quiet-tools mod, Control+F finds text in the conversation and opens the whole conversation in browse mode at the most recent match, and NVDA+Control+L reads Claude's last reply (pressed twice, it opens it in browse mode). In Claude Code, new text no longer moves the review cursor unless you turn that on in NVDA settings under Console Redraw Fix; NVDA+A reads from the review cursor, and Down Arrow puts the review cursor on the last line."""
author = "Conner Erwin <conner@connererwin.com>"
version = 1.4.0
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.3.0
